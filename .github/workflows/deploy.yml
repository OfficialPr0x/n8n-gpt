name: Deploy
on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build
      - run: npx ts-node server.ts &
      - run: sleep 5 # Give server time to start
      - run: curl http://localhost:3000/api/health || exit 1
      
      # Deploy to your hosting provider here
      # Example for Railway:
      # - uses: railwayapp/railway-github-action@master
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     command: deploy 
